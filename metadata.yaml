name: "astrbot_plugin_shim_connector"
display_name: "白嫖机器人 | 本机模型接入"
short_desc: "把你已付费的 WorkBuddy / Trae / Qoder 订阅变成机器人模型源，66 个候选模型可勾选，支持多账号池和余额查看，零 API 费用。"
author: "rawLeaf"
description: >-
  白嫖机器人：把你已经付过钱的 AI 订阅（WorkBuddy / Trae / Qoder）直接变成 AstrBot 的模型源。


  这些客户端不提供 API Key，所以以前用机器人还得再付一次 API 费用。本插件在本机起 loopback shim，
  把已有订阅额度翻译成 OpenAI 兼容端点，自动注册成 AstrBot 的 provider。


  边际成本 0：钱你已经付过了，只是换个入口给机器人用。合计 66 个候选模型
  （WorkBuddy 23 / Trae 18 / Qoder 25），可按需勾选要注册哪些。


  零配置：凭据从各客户端桌面端本地存储自动读取并解密，不填任何 token 或路径。


  多账号池（仅 WorkBuddy）：可扫码登录或从 dsh-connect-workbuddy 的 vault 导入多个账号，
  界面直接显示每个账号的剩余积分。额度用尽时自动冷却 30 分钟并换下一个，
  同区换完还能跨区兜底（国内 ↔ 国际）。


  附 WebUI 管理页（扩展功能 → 本机模型接入）：账号池 / 模型名册 / 耗费统计三个标签，
  支持勾选启停、按免费/成本/延迟排序、国内国际分组。


  另含视觉轮换层（5 上游）和通用 LLM 池（10 上游），自动切换兜底。
  五个 shim 都有 /cost 耗费统计，按模型 + 按账号两个维度。


