name: "astrbot_plugin_shim_connector"
display_name: "白嫖机器人 | 本机模型接入"
short_desc: "把你已付费的 WorkBuddy / Trae / Qoder 订阅变成机器人模型源，36 个模型，零 API 费用、零配置。"
author: "rawLeaf"
description: >-
  白嫖机器人：把你已经付过钱的 AI 订阅（WorkBuddy / Trae / Qoder）直接变成 AstrBot 的模型源。

  这些客户端不提供 API Key，所以以前用机器人还得再付一次 API 费用。本插件在本机起 loopback shim，
  把已有订阅额度翻译成 OpenAI 兼容端点，自动注册成 AstrBot 的 provider。

  边际成本 0：钱你已经付过了，只是换个入口给机器人用。合计 36 个可用模型。

  零配置：凭据从各客户端桌面端本地存储自动读取并解密，不填任何 token 或路径。

  另含视觉轮换层（5 上游）和通用 LLM 池（10 上游），自动切换兜底。
version: "1.3.1"
repo: "https://github.com/rawLeaf/astrbot_plugin_shim_connector"
homepage: "https://github.com/rawLeaf/astrbot_plugin_shim_connector"
license: "MIT"
astrbot_version: ">=4.11.0"
support_platforms:
  - aiocqhttp
  - telegram
  - discord
  - slack
  - lark
  - dingtalk
  - kook
  - matrix
  - misskey
  - satori
tags:
  - "白嫖"
  - "模型接入"
  - "本地模型"
  - "省钱"
  - "WorkBuddy"
  - "Trae"
  - "Qoder"
keywords:
  - shim
  - workbuddy
  - trae
  - qoder
  - local-model
  - openai-compatible
  - zero-cost
  - free
features:
  - "零 API 费用：复用已有订阅额度，边际成本 0"
  - "零配置：凭据从客户端桌面端自动读取解密"
  - "可选模型：每个 shim 可勾选要注册的模型，留空则全部"
  - "36 个模型：WorkBuddy 6 + Trae 6 + Qoder 24"
  - "自动起停 shim 子进程"
  - "自动探测模型并注册 provider"
  - "shim 日志落盘 + /shim logs 命令"
  - "视觉轮换层（5 上游）和通用 LLM 池（10 上游）"
  - "只绑 127.0.0.1，不暴露外网"
